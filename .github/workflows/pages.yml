name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html 404.html .nojekyll favicon.svg og.svg og.png robots.txt sitemap.xml rss.xml atom.xml site.webmanifest _site/
          cp -R assets _site/assets
          cp -R blog _site/blog
          cp -R now _site/now
          cp -R uses _site/uses
          cp -R colophon _site/colophon
          cp -R .well-known _site/.well-known
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
